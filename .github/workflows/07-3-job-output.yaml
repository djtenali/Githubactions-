name: 07-3-job-output
on:
   workflow_dispatch:
jobs:
    Prepare-job:
      name: prepare
      runs-on: ubuntu-latest
      outputs:
        image-tag: ${{steps.tag.outputs.value}}
        app-name: ${{steps.app.outputs.value}}
      steps:
      - name: Generate Image Tag
        id: tag
        run: |
          echo "value=${{github.sha}}" >> $GITHUB_OUTPUT
      - name: Set App Name
        id: app
        run: |
          echo "value=djtenali-devops-dashboard" >> $GITHUB_OUTPUT
    build-job: 
        name: build
        runs-on: ubuntu-latest
        needs: Prepare-job
        steps:
        - name: Read outputs from prepare-job
          run: |
            echo "My app name is: ${{needs.Prepare-job.outputs.app-name}}"
            echo "Image tag is: ${{needs.Prepare-job.outputs.image-tag}}"




