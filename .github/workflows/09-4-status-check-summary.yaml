name: 09-4-status-check-summary
on:
    workflow_dispatch:
jobs:
    status-functions-demo:
        runs-on: ubuntu-latest
        steps:
        - name: STEP 1 RUNS NORMALLY
          run: echo " Step 1 completed successfully"
        - name: STEP 2 fails intentionally
          run: |
            echo "this step will fail"
            exit 1
        - name: STEP 3 success()
          if: success()
          run: echo "this wil run only if all the previous steps are passed"
        - name: STEP 4 failure -runs because step 2 is failed
          if: failure()
          run: echo "previous step is failed , running some cleanup activity"
        - name: always()
          if: always()
          run: echo "this will always run -perfect for reporting"
    notify-on-failure:
        runs-on: ubuntu-latest
        needs: status-functions-demo
        if: failure() # jobe level -only if previous job failed
        steps:
        - name: Send Alerts
          run: |
            echo "Job FAILED - sending notification"
            echo "branch is : ${{github.ref_name}}"
            echo "actor is  : ${{github.actor}}"
    Final-summary:
        runs-on: ubuntu-latest
        needs: [ status-functions-demo, notify-on-failure]
        if: always()
        steps:
        - name: Write Summary
          run: |
            echo "## Pipeline Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
            echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| status-functions-demo | ${{needs.status-functions-demo.result}} |" >>  $GITHUB_STEP_SUMMARY
            echo "| notify-on-failure | ${{ needs.notify-on-failure.result}} |" >> $GITHUB_STEP_SUMMARY