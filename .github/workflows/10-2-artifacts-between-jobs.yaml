name: 10-2-artifacts-between-jobs
on:
    workflow_dispatch:
jobs:
    Build:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v7
        - name: Setup Java 21
          uses: actions/setup-java@v5
          with:
             distribution: temurin
             java-version: '21'
             cache: maven
        - name: Build and Package
          run: mvn package -DskipTests
        - name: Upload build artifact
          uses: actions/upload-artifact@v7
          with:
            name: build-artifact
            path: target/devops-dashboard-1.0.0.jar
            retention-days: 7   
    Deploy:
        name: Deploy
        runs-on: ubuntu-latest
        steps:
        - name: Download the JAR artifact
          uses: actions/download-artifact@v8
          with:
            name: build-artifact # name must match with name in line 21
            path: ./downloaded.jar
        - name: Verify downloaded artifact
          run: ls-la ./downloaded.jar/
        - name: Simulate Deployment
          run: |
            echo "Deploying to envirnment"
            echo "***********Deployment completed *************"